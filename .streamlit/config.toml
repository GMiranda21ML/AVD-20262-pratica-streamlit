# Configuração do Streamlit. Identidade visual do dashboard ITBI Recife:
# terracota (tijolo/imóvel) sobre um fundo neutro quente (ocre claro).
# O tema pode ser trocado pelo menu ⋮ → Settings → Choose app theme.

[theme]
paddingTop = "0.5rem"     # espaço abaixo da barra do topo (valor entre aspas)
# font = "sans serif"     # "sans serif", "serif" ou "monospace"

[theme.light]
primaryColor = "#b4532a"              # terracota — cor de destaque (widgets, links)
backgroundColor = "#fffaf5"           # fundo da página (branco levemente quente)
secondaryBackgroundColor = "#f3e9df"  # fundo da sidebar e de widgets (ocre claro)
textColor = "#3a2e28"                 # cor do texto (marrom escuro)
borderColor = "#ddc9b4"
chartCategoricalColors = ["#b4532a", "#2f6f6a"]  # Residencial / Comercial (tipo_ocupa_bin)

[theme.dark]
primaryColor = "#d97757"              # terracota mais claro, pra contraste no fundo escuro
backgroundColor = "#1c1410"
secondaryBackgroundColor = "#2b211b"
textColor = "#f3e9df"
borderColor = "#4a3b31"
chartCategoricalColors = ["#d97757", "#5fb3ac"]
